name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest version readme.txt promises, and the newest release.
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint every PHP file
        run: |
          find . -name '*.php' -not -path './node_modules/*' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install coding standards
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            wp-coding-standards/wpcs:3.4.1 phpcompatibility/phpcompatibility-wp:2.1.8
      - name: Run PHPCS (phpcs.xml.dist)
        run: "$(composer global config bin-dir --absolute --quiet)/phpcs"

  build:
    name: Checkout script matches source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Committed build is up to date
        run: |
          if ! git diff --exit-code -- assets/js/frontend; then
            echo "::error::assets/js/frontend is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

  versions:
    name: Version numbers agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/check-versions.sh

  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the package as WordPress.org receives it
        run: |
          mkdir -p build/straumur-payments-for-woocommerce
          rsync -a --exclude-from=.distignore --exclude=/build ./ build/straumur-payments-for-woocommerce/
      - uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: build/straumur-payments-for-woocommerce
          slug: straumur-payments-for-woocommerce
          ignore-warnings: true
